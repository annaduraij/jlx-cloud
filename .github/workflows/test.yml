name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y cloud-init shellcheck
      - name: Run checks
        env:
          REQUIRE_CLOUD_INIT: "1"
          REQUIRE_SHELLCHECK: "1"
        run: ./tests/test.sh
